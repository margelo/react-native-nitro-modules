name: Test Nitrogen init command

on:
  push:
    branches:
      - main
    paths:
      - 'core'
      - '.gitmodules'
      - 'scripts/sync-core.mjs'
      - '.github/workflows/run-nitrogen-init.yml'
      - '**/*.lockb'
      - '**/package.json'
      - 'packages/template/**'
  pull_request:
    paths:
      - 'core'
      - '.gitmodules'
      - 'scripts/sync-core.mjs'
      - '.github/workflows/run-nitrogen-init.yml'
      - '**/*.lockb'
      - '**/package.json'
      - 'packages/template/**'

jobs:
  lint:
    name: Run Nitrogen init command
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2

      - name: Install npm dependencies (bun)
        run: bun install

      - name: Build all packages
        run: bun run build

      - name: Run nitrogen init outside the repository
        working-directory: ${{ runner.temp }}
        run: node "$GITHUB_WORKSPACE/core/packages/nitrogen/lib/index.js" init react-native-math
